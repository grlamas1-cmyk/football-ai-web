<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Football Analytics</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      width: 300px;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    button {
      padding: 10px;
      background: #38bdf8;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>⚽ Football Analytics</h1>

<div class="card">
  <h2>🔮 Predicciones</h2>
  <input placeholder="Equipo local">
  <input placeholder="Equipo visitante">
  <br><br>
  <button>Predecir</button>
</div>

<div class="card">
  <h2>💰 Value Bets</h2>
  <p>Próximamente</p>
</div>

<div class="card">
  <h2>📊 Estadísticas</h2>
  <p>Próximamente</p>
</div>

</body>
</html>
